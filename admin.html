<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSTORE Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f1f3f6;
}

header{
background:#131921;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
color:#ff9900;
}

.container{
padding:20px;
}

.login-box{
width:350px;
background:white;
padding:25px;
margin:80px auto;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.login-box h2{
margin-bottom:20px;
text-align:center;
}

.login-box input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

.login-box button{
width:100%;
padding:12px;
background:#ff9900;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.login-box button:hover{
background:#e68a00;
}

.admin-panel{
display:none;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.card h3{
margin-bottom:10px;
color:#555;
}

.card p{
font-size:25px;
font-weight:bold;
color:#ff9900;
}

.section{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:30px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.section h2{
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:12px 20px;
background:#131921;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
opacity:0.9;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.product{
background:#fafafa;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
}

.product img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

.product h3{
margin-bottom:10px;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.delete-btn{
background:red;
width:100%;
margin-top:10px;
}

.order{
background:#fafafa;
padding:15px;
border-radius:10px;
margin-bottom:15px;
border:1px solid #ddd;
}

</style>

</head>
<body>

<header>
<div class="logo">DSTORE💲 ADMIN</div>
</header>

<div class="container">

<!-- LOGIN -->

<div class="login-box" id="loginBox">

<h2>تسجيل دخول الأدمن</h2>

<input type="password" id="password" placeholder="اكتب كلمة السر">

<button onclick="login()">دخول</button>

</div>

<!-- ADMIN PANEL -->

<div class="admin-panel" id="adminPanel">

<div class="cards">

<div class="card">
<h3>عدد المنتجات</h3>
<p id="productsCount">0</p>
</div>

<div class="card">
<h3>عدد الطلبات</h3>
<p id="ordersCount">0</p>
</div>

<div class="card">
<h3>عدد الزوار</h3>
<p id="visitorsCount">0</p>
</div>

</div>

<!-- ADD PRODUCT -->

<div class="section">

<h2>إضافة منتج جديد</h2>

<input type="text" id="productName" placeholder="اسم المنتج">

<input type="number" id="productPrice" placeholder="السعر بالجنيه المصري">

<input type="text" id="productImage" placeholder="رابط صورة المنتج">

<select id="paymentMethod">
<option>كاش</option>
<option>فيزا</option>
<option>الدفع عند الاستلام</option>
</select>

<button onclick="addProduct()">إضافة المنتج</button>

</div>

<!-- PRODUCTS -->

<div class="section">

<h2>المنتجات</h2>

<div class="products" id="productsBox"></div>

</div>

<!-- ORDERS -->

<div class="section">

<h2>الطلبات</h2>

<div id="ordersBox"></div>

</div>

</div>

</div>

<script>

const adminPassword = "dstore2011";

function login(){

const password = document.getElementById("password").value;

if(password === adminPassword){

document.getElementById("loginBox").style.display = "none";

document.getElementById("adminPanel").style.display = "block";

loadProducts();

loadOrders();

loadStats();

}else{

alert("كلمة المرور غير صحيحة");

}

}

function addProduct(){

const name = document.getElementById("productName").value;

const price = document.getElementById("productPrice").value;

const image = document.getElementById("productImage").value;

const payment = document.getElementById("paymentMethod").value;

if(name === "" || price === "" || image === ""){

alert("املأ جميع البيانات");

return;

}

let products = JSON.parse(localStorage.getItem("products")) || [];

products.push({

name:name,

price:price,

image:image,

payment:payment

});

localStorage.setItem("products", JSON.stringify(products));

alert("تم إضافة المنتج");

document.getElementById("productName").value = "";

document.getElementById("productPrice").value = "";

document.getElementById("productImage").value = "";

loadProducts();

loadStats();

}

function loadProducts(){

const productsBox = document.getElementById("productsBox");

productsBox.innerHTML = "";

let products = JSON.parse(localStorage.getItem("products")) || [];

products.forEach((product,index)=>{

productsBox.innerHTML += `

<div class="product">

<img src="${product.image}">

<h3>${product.name}</h3>

<div class="price">${product.price} EGP</div>

<p>الدفع: ${product.payment}</p>

<button class="delete-btn" onclick="deleteProduct(${index})">

حذف المنتج

</button>

</div>

`;

});

}

function deleteProduct(index){

let products = JSON.parse(localStorage.getItem("products")) || [];

products.splice(index,1);

localStorage.setItem("products", JSON.stringify(products));

loadProducts();

loadStats();

}

function loadOrders(){

const ordersBox = document.getElementById("ordersBox");

ordersBox.innerHTML = "";

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.forEach(order=>{

ordersBox.innerHTML += `

<div class="order">

<h3>${order.product}</h3>

<p><strong>اسم العميل:</strong> ${order.customer}</p>

<p><strong>رقم الهاتف:</strong> ${order.phone}</p>

<p><strong>العنوان:</strong> ${order.address}</p>

<p><strong>طريقة الدفع:</strong> ${order.payment}</p>

<p><strong>الحالة:</strong> ${order.status}</p>

</div>

`;

});

}

function loadStats(){

let products = JSON.parse(localStorage.getItem("products")) || [];

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let visitors = localStorage.getItem("visitors") || 0;

document.getElementById("productsCount").innerText = products.length;

document.getElementById("ordersCount").innerText = orders.length;

document.getElementById("visitorsCount").innerText = visitors;

}

</script>

</body>
  </html></body>
</html>
