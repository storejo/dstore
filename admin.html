<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSTORE ADMIN</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f1f1f1;
}

header{
background:#131921;
color:white;
padding:15px;
font-size:28px;
font-weight:bold;
text-align:center;
}

.login-box{
width:350px;
background:white;
padding:25px;
margin:80px auto;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.login-box h2{
text-align:center;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

.login-box button{
width:100%;
padding:12px;
background:#ff9900;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.login-box button:hover{
background:#e68a00;
}

#adminPanel{
display:none;
padding:20px;
}

.section{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.section h2{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

.add-btn{
background:#131921;
color:white;
padding:12px;
border:none;
border-radius:5px;
cursor:pointer;
width:100%;
font-size:18px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.product{
background:#fafafa;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
}

.product img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

.price{
color:green;
font-size:20px;
font-weight:bold;
}

.delete-btn{
background:red;
color:white;
padding:10px;
border:none;
border-radius:5px;
cursor:pointer;
width:100%;
margin-top:10px;
}

</style>

</head>

<body>

<header>

DSTORE💲 ADMIN

</header>

<!-- LOGIN -->

<div class="login-box" id="loginBox">

<h2>تسجيل دخول الأدمن</h2>

<input type="password" id="password" placeholder="اكتب كلمة السر">

<button onclick="login()">دخول</button>

</div>

<!-- ADMIN PANEL -->

<div id="adminPanel">

<div class="section">

<h2>إضافة منتج</h2>

<input type="text" id="productName" placeholder="اسم المنتج">

<input type="number" id="productPrice" placeholder="السعر بالجنيه المصري">

<input type="text" id="productImage" placeholder="رابط صورة المنتج">

<button class="add-btn" onclick="addProduct()">

إضافة المنتج

</button>

</div>

<div class="section">
