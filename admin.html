<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأدمن</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-form" id="login-box">
<h2>تسجيل دخول الأدمن</h2>
<input type="password" id="password" placeholder="كلمة السر">
<button onclick="login()">دخول</button>
</div>

<div id="admin-panel" style="display:none;padding:20px;">
<h1>لوحة تحكم DSTORE</h1>

<h2>إضافة منتج</h2>
<input type="text" id="pname" placeholder="اسم المنتج">
<input type="number" id="pprice" placeholder="السعر بالجنيه المصري">
<input type="text" id="pimage" placeholder="رابط صورة المنتج">
<button onclick="addProduct()">إضافة المنتج</button>

<h2>المنتجات</h2>
<div id="admin-products"></div>

<h2>الطلبات</h2>
<div id="orders"></div>

<h2>إحصائيات</h2>
<p>عدد مستخدمين الموقع: <span id="visitors">0</span></p>
</div>

<script src="admin.js"></script>
</body>
</html>
